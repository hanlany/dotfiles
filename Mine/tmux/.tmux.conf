# Set mouse mode on
set -g mouse on

# Set pane history limit to a higher value
set -g history-limit 9999

# Fix vim colorscheme problem in xterminal
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256color:RGB"
#set -g allow-passthrough on

set-environment -g COLORTERM "truecolor"

# Enable vi mode-keys in copy mode
setw -g mode-keys vi

# Keybind
## Reload with <Prefix>r
bind-key r source-file ~/.tmux.conf \; display "Reloaded from ~/.tmux.conf"

###############################################################################
################################PLUGINS########################################
# Plugin for copying to system clipboard. Works on MacOS, Linux and Cygwin.
set -g @plugin 'tmux-plugins/tmux-yank'

# Plugin for using vim keybind to navigate through tmux panes
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
